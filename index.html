<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Mening AI</title>
<style>
:root{--bg:#faf9f5;--fg:#29261b;--muted:#83827d;--card:#ffffff;--line:#e8e6dc;--acc:#d97757;--user:#f0eee6}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--fg:#f0eee6;--muted:#9c9a92;--card:#30302e;--line:#41403b;--user:#383836}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:20px;margin:0;display:flex;align-items:center;gap:8px}
.logo{color:var(--acc);font-size:24px}
#yangi{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:6px 12px;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:8px 16px 16px;max-width:720px;width:100%;margin:0 auto}
.salom{text-align:center;margin-top:18vh;font-family:Georgia,serif;font-size:30px;line-height:1.3}
.salom .logo{display:block;font-size:40px;margin-bottom:8px}
.salom small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:15px;color:var(--muted);margin-top:8px}
.m{margin:14px 0;line-height:1.6;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:var(--user);padding:10px 14px;border-radius:16px;margin-left:auto;width:fit-content;max-width:88%}
.m.a{padding:0 2px}
.m code{background:var(--user);padding:1px 5px;border-radius:5px;font-size:14px}
.m pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0;white-space:pre}
.m pre code{background:none;padding:0}
.nuqta{display:inline-flex;gap:4px}
.nuqta i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:b 1.2s infinite}
.nuqta i:nth-child(2){animation-delay:.2s}.nuqta i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
footer{padding:8px 12px calc(12px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:inherit;font-size:16px;max-height:140px;padding:6px 0}
#yubor{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:18px;flex:none}
#yubor:disabled{opacity:.4}
</style>
</head>
<body>
<header>
  <h1><span class="logo">✺</span>Mening AI</h1>
  <button id="yangi">Yangi suhbat</button>
</header>
<div id="chat"></div>
<footer>
  <div class="box">
    <textarea id="q" rows="1" placeholder="Savolingizni yozing..."></textarea>
    <button id="yubor">↑</button>
  </div>
</footer>
<script>
var KEY = "mening_ai_tarix";
var tarix = [];
try { tarix = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
var chat = document.getElementById("chat");
var q = document.getElementById("q");
var btn = document.getElementById("yubor");

function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(t){
  t = esc(t);
  t = t.replace(/```\w*\n?([\s\S]*?)```/g, function(m,c){return "<pre><code>"+c+"</code></pre>";});
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  return t;
}
function saqla(){ try { localStorage.setItem(KEY, JSON.stringify(tarix)); } catch (e) {} }
function pastga(){ chat.scrollTop = chat.scrollHeight; }
function qosh(rol, matn){
  var d = document.createElement("div");
  d.className = "m " + (rol === "user" ? "u" : "a");
  if (rol === "user") d.textContent = matn; else d.innerHTML = fmt(matn);
  chat.appendChild(d); pastga(); return d;
}
function salom(){
  chat.innerHTML = '<div class="salom"><span class="logo">✺</span>Salom! Bugun nima haqida gaplashamiz?<small>Men sizning shaxsiy AI yordamchingizman</small></div>';
}
function chiz(){
  chat.innerHTML = "";
  if (!tarix.length) { salom(); return; }
  tarix.forEach(function(m){ qosh(m.role, m.content); });
}
async function yubor(){
  var matn = q.value.trim();
  if (!matn || btn.disabled) return;
  if (!tarix.length) chat.innerHTML = "";
  q.value = ""; q.style.height = "auto";
  tarix.push({role:"user", content:matn}); saqla();
  qosh("user", matn);
  btn.disabled = true;
  var d = qosh("assistant", "");
  d.innerHTML = '<span class="nuqta"><i></i><i></i><i></i></span>';
  try {
    var r = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:tarix})});
    var j = await r.json();
    d.innerHTML = fmt(j.javob);
    tarix.push({role:"assistant", content:j.javob}); saqla();
  } catch (e) {
    d.textContent = "Ulanishda xato. Internetni tekshirib, qayta urinib ko'ring.";
    tarix.pop(); saqla();
  }
  btn.disabled = false; pastga();
}
btn.onclick = yubor;
q.addEventListener("input", function(){ q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
document.getElementById("yangi").onclick = function(){
  if (!tarix.length || confirm("Suhbat o'chirilsinmi?")) { tarix = []; saqla(); chiz(); }
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
chiz();
</script>
</body>
</html>
